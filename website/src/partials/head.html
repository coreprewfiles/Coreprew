<!doctype html>
<html lang="en-AU" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{site_url}}{{path}}">
  <meta name="theme-color" content="#0f0f0e">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Coreprew Films">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{site_url}}{{path}}">
  <meta property="og:image" content="{{site_url}}/assets/img/hero/{{og_image}}-1600.webp">
  <meta property="og:locale" content="en_AU">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" sizes="64x64" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>document.documentElement.classList.remove('no-js');</script>
{{head_extra}}
</head>
